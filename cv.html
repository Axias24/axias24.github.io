<main id="content">
  <header class="page-head">
    <div class="wrap">
      <p class="label">Wantian Huang · Economics, University of Maryland</p>
      <h1>Curriculum Vitae</h1>
      <div class="actions">
        <a class="btn primary" href="assets/cv.pdf">Download CV (PDF)</a>
        <a class="btn ghost" href="assets/resume.pdf">Resume (PDF)</a>
      </div>
    </div>
  </header>

  <section class="viewer" aria-label="CV">
    <div class="wrap">
      <div class="cv-pages" id="cv-pages">
        <p class="pdf-fallback" id="cv-status">Loading the CV…</p>
      </div>
    </div>
  </section>
  <script src="assets/vendor/pdf.min.js"></script>
  <script>
  (function () {
    var box = document.getElementById('cv-pages');
    var fallback = '<p class="pdf-fallback">The CV could not be displayed here. <a href="assets/cv.pdf">Open the CV (PDF)</a>.</p>';
    if (!window.pdfjsLib) { box.innerHTML = fallback; return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'assets/vendor/pdf.worker.min.js';
    pdfjsLib.getDocument('assets/cv.pdf').promise.then(async function (pdf) {
      var width = box.clientWidth, ratio = Math.min(window.devicePixelRatio || 1, 2);
      box.innerHTML = '';
      for (var i = 1; i <= pdf.numPages; i++) {
        var page = await pdf.getPage(i);
        var scale = width / page.getViewport({ scale: 1 }).width;
        var vp = page.getViewport({ scale: scale * ratio });
        var canvas = document.createElement('canvas');
        canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'CV, page ' + i + ' of ' + pdf.numPages);
        box.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }
    }).catch(function () { box.innerHTML = fallback; });
  })();
  </script>
</main>
